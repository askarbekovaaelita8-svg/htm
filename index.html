<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой список задач</title>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#718096; --primary:#4f46e5; --danger:#dc2626; --border:#e5e7eb; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text); background:linear-gradient(135deg,#eef2ff,var(--bg)); }
    .todo { width:min(100%,560px); padding:32px; border-radius:20px; background:var(--card); box-shadow:0 20px 50px #26324a1a; }
    h1 { margin:0 0 8px; font-size:clamp(28px,5vw,38px); letter-spacing:-.04em; } .subtitle { margin:0 0 24px; color:var(--muted); }
    .form { display:flex; gap:10px; } input { min-width:0; flex:1; padding:13px 15px; border:1px solid var(--border); border-radius:10px; font:inherit; outline:none; transition:.2s; }
    input:focus { border-color:var(--primary); box-shadow:0 0 0 3px #4f46e51c; } button { border:0; border-radius:10px; padding:0 18px; color:#fff; background:var(--primary); font:600 15px inherit; cursor:pointer; transition:.2s; }
    button:hover { filter:brightness(.94); transform:translateY(-1px); } .empty { margin:26px 0 0; padding:18px; border:1px dashed #cbd5e1; border-radius:12px; color:var(--muted); text-align:center; }
    .tasks { display:grid; gap:10px; margin:24px 0 0; padding:0; list-style:none; } .task { display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--border); border-radius:12px; background:#fafbff; }
    .task-text { flex:1; cursor:pointer; overflow-wrap:anywhere; } .task.done .task-text { color:var(--muted); text-decoration:line-through; }
    .delete { padding:7px 10px; color:var(--danger); background:#fee2e2; font-size:13px; } .delete:hover { background:#fecaca; }
    @media (max-width:480px) { .todo { padding:24px 18px; } .form { flex-direction:column; } button { min-height:46px; } }
  </style>
</head>
<body>
  <main class="todo">
    <h1>Мои задачи</h1><p class="subtitle">Добавляйте дела и отмечайте выполненные</p>
    <form class="form" id="todoForm"><input id="taskInput" type="text" placeholder="Например: изучить JavaScript" autocomplete="off" aria-label="Новая задача"><button type="submit">Добавить</button></form>
    <p class="empty" id="emptyMessage">Список задач пустой</p><ul class="tasks" id="taskList"></ul>
  </main>
  <script>
    const form = document.querySelector('#todoForm');
    const input = document.querySelector('#taskInput');
    const list = document.querySelector('#taskList');
    const emptyMessage = document.querySelector('#emptyMessage');
    function updateEmptyMessage() { emptyMessage.hidden = list.children.length > 0; }
    function addTask(text) {
      const item = document.createElement('li'); item.className = 'task';
      const taskText = document.createElement('span'); taskText.className = 'task-text'; taskText.textContent = text; taskText.title = 'Нажмите, чтобы отметить задачу выполненной';
      taskText.addEventListener('click', () => item.classList.toggle('done'));
      const deleteButton = document.createElement('button'); deleteButton.className = 'delete'; deleteButton.type = 'button'; deleteButton.textContent = 'Удалить';
      deleteButton.addEventListener('click', () => { item.remove(); updateEmptyMessage(); }); item.append(taskText, deleteButton); list.append(item); updateEmptyMessage();
    }
    form.addEventListener('submit', (event) => { event.preventDefault(); const text = input.value.trim(); if (!text) { input.focus(); return; } addTask(text); input.value = ''; input.focus(); });
    updateEmptyMessage();
  </script>
</body>
</html>
